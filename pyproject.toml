[project]
name = "ml-research-cli-agent"
version = "0.1.0"
description = "A bounded multi-agent AI/ML research CLI"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "rich>=14,<15",
]

[project.scripts]
research-agent = "research_agent.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.workspace]
members = [
    "test-proj",
]
